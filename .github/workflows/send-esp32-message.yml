name: Send message to ESP32

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: Message UUID generated by the client
        required: true
        type: string
      device_id:
        description: Target ESP32 device ID
        required: true
        type: string
      text:
        description: Text displayed by the ESP32
        required: true
        type: string
      sent_at_ms:
        description: Client send time in Unix milliseconds
        required: true
        type: string
      display_duration_ms:
        description: Display duration in milliseconds
        required: true
        default: "10000"
        type: string
      buzzer_duration_ms:
        description: Buzzer duration budget in milliseconds
        required: true
        default: "3000"
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish MQTT command
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      MESSAGE_ID: ${{ inputs.message_id }}
      REQUESTED_DEVICE_ID: ${{ inputs.device_id }}
      TEXT: ${{ inputs.text }}
      SENT_AT_MS: ${{ inputs.sent_at_ms }}
      DISPLAY_DURATION_MS: ${{ inputs.display_duration_ms }}
      BUZZER_DURATION_MS: ${{ inputs.buzzer_duration_ms }}
      DEVICE_ID: ${{ secrets.ESP32_DEVICE_ID }}
      EMQX_API_URL: ${{ secrets.EMQX_API_URL }}
      EMQX_APP_ID: ${{ secrets.EMQX_APP_ID }}
      EMQX_APP_SECRET: ${{ secrets.EMQX_APP_SECRET }}
    steps:
      - name: Validate and publish
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
          const required = [
            "MESSAGE_ID", "REQUESTED_DEVICE_ID", "TEXT", "SENT_AT_MS",
            "DISPLAY_DURATION_MS", "BUZZER_DURATION_MS", "DEVICE_ID",
            "EMQX_API_URL", "EMQX_APP_ID", "EMQX_APP_SECRET",
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing required value: ${name}`);
          }

          const text = process.env.TEXT.trim();
          const displayDurationMs = Number(process.env.DISPLAY_DURATION_MS);
          const buzzerDurationMs = Number(process.env.BUZZER_DURATION_MS);
          const sentAt = Number(process.env.SENT_AT_MS);
          if (process.env.REQUESTED_DEVICE_ID !== process.env.DEVICE_ID) {
            throw new Error("Requested device is not allowed");
          }
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(process.env.MESSAGE_ID)) {
            throw new Error("message_id must be a UUID");
          }
          if ([...text].length < 1 || [...text].length > 120) {
            throw new Error("text must contain between 1 and 120 characters");
          }
          if (!Number.isInteger(displayDurationMs) || displayDurationMs < 1000 || displayDurationMs > 60000) {
            throw new Error("display_duration_ms must be between 1000 and 60000");
          }
          if (!Number.isInteger(buzzerDurationMs) || buzzerDurationMs < 0 || buzzerDurationMs > 10000) {
            throw new Error("buzzer_duration_ms must be between 0 and 10000");
          }
          if (!Number.isSafeInteger(sentAt) || sentAt <= 0) {
            throw new Error("sent_at_ms must be a positive integer");
          }

          const message = {
            messageId: process.env.MESSAGE_ID,
            deviceId: process.env.DEVICE_ID,
            type: "display",
            text,
            displayDurationMs,
            buzzerDurationMs,
            sentAt,
          };
          const apiUrl = `${process.env.EMQX_API_URL.replace(/\/+$/, "")}/publish`;
          const authorization = Buffer.from(
            `${process.env.EMQX_APP_ID}:${process.env.EMQX_APP_SECRET}`,
          ).toString("base64");
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              authorization: `Basic ${authorization}`,
              "content-type": "application/json",
            },
            body: JSON.stringify({
              topic: `devices/${process.env.DEVICE_ID}/commands/display`,
              qos: 1,
              retain: false,
              payload_encoding: "plain",
              payload: JSON.stringify(message),
            }),
          });
          const responseText = await response.text();
          if (!response.ok) {
            throw new Error(`EMQX publish failed with HTTP ${response.status}: ${responseText.slice(0, 256)}`);
          }
          console.log(`Published message ${process.env.MESSAGE_ID} to device ${process.env.DEVICE_ID}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
